# Silver Task — performance targets (Phase 60).
#
# Read by scripts/lib/perf.sh's st_perf_classify — plain `key=value`, one per line, parsed the
# same sed-based way every other config/env file in this codebase already is (no new parsing
# dependency). Adjust freely; nothing here is enforced by the application itself, only by
# scripts/test-performance.sh's own reporting.
#
# Lookup order for a given operation+dataset (first match wins):
#   1. <operation>.<dataset>.fast_ms / .acceptable_ms / .warning_ms   (dataset-specific override)
#   2. <operation>.fast_ms / .acceptable_ms / .warning_ms             (operation default)
#   3. default.fast_ms / .acceptable_ms / .warning_ms                 (global fallback)
#
# A duration <= fast_ms is FAST. <= acceptable_ms is ACCEPTABLE. <= warning_ms is WARNING.
# Anything above warning_ms is SLOW. These are starting points, not measured-and-proven — see
# docs/performance.md "Performance targets" for how to tune them from your own baseline numbers
# once you have them (scripts/test-performance.sh prints the real numbers every run).

# --- Global fallback (used by any operation with no more specific entry below) ---
default.fast_ms=200
default.acceptable_ms=500
default.warning_ms=1500

# --- Login / auth ---
login.fast_ms=150
login.acceptable_ms=400
login.warning_ms=1000

# --- Dashboard (several widget queries per Section 21's own audit finding — a real request that
# legitimately does more work than a single list fetch) ---
dashboard.fast_ms=250
dashboard.acceptable_ms=600
dashboard.warning_ms=1800

# --- My Tasks / project sheet load — scale with dataset size, since "how long to load every task
# in a project" is expected to grow with the actual task count, not stay flat ---
