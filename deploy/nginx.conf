# Silver-Task v1.0.0 — example nginx reverse-proxy config. Terminates TLS, forwards everything
# to Kestrel (bound to loopback-only per deploy/silvertask.service), and upgrades the SignalR
# notification hub connection to a WebSocket instead of falling back to long-polling.
#
# Install (adjust paths/domain, then):
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/silvertask
#   sudo ln -s /etc/nginx/sites-available/silvertask /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get a real certificate (e.g. via certbot/Let's Encrypt) rather than hand-rolling one —
# `certbot --nginx -d tasks.example.com` will rewrite the ssl_certificate lines below for you.

server {
    listen 80;
    server_name tasks.example.com;
    # Redirect all plain HTTP to HTTPS — Kestrel's own UseHttpsRedirection also runs, but
    # redirecting at the edge avoids an unnecessary round trip to the app for every plain request.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name tasks.example.com;

    ssl_certificate     /etc/letsencrypt/live/tasks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tasks.example.com/privkey.pem;

    # Reasonable size limit for file attachment uploads — must be >= the app's own
    # Attachments.MaxSizeMb admin setting, or nginx will reject large uploads before the app
    # ever gets a chance to apply its own (more specific, admin-configurable) limit.
    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Required for ForwardedHeadersMiddleware (Program.cs) to see the real client IP/scheme —
        # without these, the app would think every request is plain HTTP from nginx itself.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SignalR (the in-app notification real-time push, /hubs/notifications) needs the WebSocket
    # Upgrade/Connection headers explicitly forwarded — without this block it silently falls back
    # to long-polling, which still works but adds latency and load; getting Upgrade wrong entirely
    # (proxying it through the generic location above without these headers) breaks it outright.
    location /hubs/notifications {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
    }
}
